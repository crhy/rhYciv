name: Release

# Builds every shipped artifact for a tag and publishes them as one GitHub
# release: self-contained desktop builds for Linux, Windows and both macOS
# architectures, plus the Linux Flatpak bundle.
#
# The builds are self-contained and deliberately NOT trimmed. RaylibUI discovers
# its IUserInterface implementations by reflecting over the assemblies beside the
# executable (see RaylibUI/Initialization/Helpers.cs); trimming or single-file
# publish removes exactly those, and the game would fail at startup with no
# interface to render with. That is why each archive is ~190 MB.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (for re-running a release)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  # Fail before spending 20 minutes on four platform builds if the tag and the
  # version in the tree disagree.
  version:
    name: Check tag matches the build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - id: check
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          python3 scripts/check_version_consistency.py
          declared=$(python3 -c "
          import re, pathlib
          p = pathlib.Path('Directory.Build.props').read_text()
          prefix = re.search(r'<VersionPrefix>([^<]+)</VersionPrefix>', p).group(1).strip()
          m = re.search(r'<VersionSuffix>([^<]*)</VersionSuffix>', p)
          suffix = m.group(1).strip() if m else ''
          print(f'{prefix}-{suffix}' if suffix else prefix)
          ")
          if [ "$declared" != "$version" ]; then
            echo "::error::Tag $tag implies version $version but Directory.Build.props declares $declared"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version from $tag"

  desktop:
    name: ${{ matrix.label }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            label: Linux x64
          - os: windows-latest
            rid: win-x64
            label: Windows x64
          # Both Mac targets build on the Apple-silicon image. The Intel build is
          # cross-compiled rather than run on macos-13: that image is being
          # retired, and the job for it sat queued without ever being assigned a
          # runner. .NET resolves the native raylib binaries from the RID's own
          # runtime package, so the host architecture does not affect the output.
          - os: macos-latest
            rid: osx-arm64
            label: macOS Apple silicon
          - os: macos-latest
            rid: osx-x64
            label: macOS Intel

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish
        shell: bash
        run: |
          dotnet publish RaylibUI/RaylibUI.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:DebugType=none \
            -o publish

      # macOS gets a real .app so a tester can double-click it. The published
      # output goes in Contents/MacOS, which is also what AppContext.BaseDirectory
      # resolves to, so the bundled art is found exactly as on the other platforms.
      - name: Build the macOS app bundle
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          version="${{ needs.version.outputs.version }}"
          app="rhYciv.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp -R publish/. "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/RaylibUI"

          iconset=icon.iconset
          mkdir -p "$iconset"
          for size in 16 32 64 128 256 512; do
            sips -z $size $size RaylibUI/FOSSart/rhyciv-app-icon.png \
              --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z $((size*2)) $((size*2)) RaylibUI/FOSSart/rhyciv-app-icon.png \
              --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/rhYciv.icns"

          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>rhYciv</string>
            <key>CFBundleDisplayName</key><string>rhYciv</string>
            <key>CFBundleIdentifier</key><string>io.github.crhy.rhYciv</string>
            <key>CFBundleVersion</key><string>${version}</string>
            <key>CFBundleShortVersionString</key><string>${version}</string>
            <key>CFBundleExecutable</key><string>RaylibUI</string>
            <key>CFBundleIconFile</key><string>rhYciv.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

      # A note inside the archive, because the first thing that goes wrong is
      # never read on the download page.
      #
      # A self-contained build is an executable plus the nine hundred files it
      # needs beside it. Windows Explorer will happily let somebody double-click
      # the .exe while it is still inside the zip: it extracts that one file to a
      # temporary folder, runs it there with none of its companions, and the
      # runtime fails with "Could not load file or assembly 'System.Runtime'".
      # That is a complete build and a correct download failing for a reason that
      # reads like a broken one -- reported by a tester in exactly those words.
      - name: Write the note that ships in the archive
        shell: bash
        run: |
          cat > publish/READ-ME-FIRST.txt <<'NOTE'
          rhYciv
          ======

          EXTRACT THIS FOLDER FIRST, then run the game from where you extracted it.

          Do not run the game from inside the zip. Windows will let you
          double-click it there, but it only unpacks the one file you clicked, and
          the game will stop with an error about "System.Runtime" or a missing
          assembly. Nothing is wrong with the download -- the program simply needs
          the rest of the folder beside it.

            Windows : right-click the zip -> Extract All, then run RaylibUI.exe
            macOS   : unzip, then drag rhYciv.app to Applications
            Linux   : tar -xzf the archive, then run ./RaylibUI

          The builds are not code-signed, so Windows SmartScreen and macOS
          Gatekeeper will both warn on first launch. On macOS, clear the quarantine
          flag with:

            xattr -dr com.apple.quarantine /Applications/rhYciv.app

          Nothing else is needed: no Civilization II installation, and no .NET
          runtime to install. Everything is in this folder.

          Problems: https://github.com/crhy/rhYciv/issues
          NOTE

      - name: Package
        shell: bash
        run: |
          name="rhYciv-${{ needs.version.outputs.version }}-${{ matrix.rid }}"
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv publish "$name"
            7z a -tzip "dist/$name.zip" "$name" >/dev/null
          elif [ "${{ runner.os }}" = "macOS" ]; then
            # ditto preserves the bundle's executable bits and resource forks.
            ditto -c -k --sequesterRsrc --keepParent rhYciv.app "dist/$name.zip"
          else
            mv publish "$name"
            chmod +x "$name/RaylibUI"
            tar -czf "dist/$name.tar.gz" "$name"
          fi
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          retention-days: 7

  flatpak:
    name: Linux Flatpak
    needs: version
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6
        with:
          bundle: rhYciv-${{ needs.version.outputs.version }}-x86_64.flatpak
          manifest-path: packaging/flatpak/io.github.crhy.rhYciv.yml
          cache-key: flatpak-builder-${{ runner.os }}-${{ github.sha }}

  publish:
    name: Publish the GitHub release
    needs: [version, desktop, flatpak]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # Collect into an array rather than globbing on the command line: an
          # unmatched glob would be passed through literally and fail the release
          # after twenty minutes of platform builds.
          mapfile -t assets < <(find artifacts -type f \
            \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.flatpak' \) | sort)

          printf 'asset: %s\n' "${assets[@]}"
          if [ "${#assets[@]}" -lt 5 ]; then
            echo "::error::Expected 5 artifacts (4 desktop + flatpak), found ${#assets[@]}"
            exit 1
          fi

          gh release create "$tag" \
            --title "rhYciv ${{ needs.version.outputs.version }}" \
            --notes-file docs/RELEASE-NOTES.md \
            --verify-tag \
            "${assets[@]}"
